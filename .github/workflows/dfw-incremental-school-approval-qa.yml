name: DFW incremental school capability review (QA-only, no deploy)
on:
  pull_request:
    paths:
      - 'scripts/evaluate-dfw-incremental-school-approval.cjs'
      - 'tests/dfw-incremental-school-approval.test.cjs'
      - 'data/dfw-incremental-school-approval-evidence-2026.json'
      - 'docs/DFW_INCREMENTAL_SCHOOL_RELEASE_APPROVAL.md'
      - 'docs/RESIDENTIAL_SCHOOL_RELEASE_GATE.md'
      - '.github/workflows/dfw-incremental-school-approval-qa.yml'
  workflow_dispatch:
concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  district-capability-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned checkout v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned setup-node v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate script and negative review test syntax
        run: |
          node --check scripts/evaluate-dfw-incremental-school-approval.cjs
          node --check tests/dfw-incremental-school-approval.test.cjs
          node --check scripts/verify-residential-school-release.cjs
      - name: Test independent district evidence tier safety and privacy
        run: |
          node --test tests/dfw-incremental-school-approval.test.cjs
          node --test tests/residential-school-release-gate.test.cjs
      - name: Generate eight-district capabilities from reviewed evidence baseline
        run: node scripts/evaluate-dfw-incremental-school-approval.cjs
      - name: Check NO-GO remains active for unverified 2026-27 residential evidence
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('artifacts/dfw-per-district-capability-review.json','utf8'));
          if(r.production.status!=='NO_GO'||r.production.ownerApprovalRequired!==true||
             r.scope.districtsEvaluated!==8||Object.values(r.districts).some(d=>d.productionAuthorized))
            throw Error('A school assignment or release was falsely approved');
          console.log('FAIL_CLOSED_FULL_PRODUCTION_GATE confirmed; candidate tier report generated');
          NODE
      - name: Upload non-residential, redacted capability status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned upload-artifact v4
        with:
          name: dfw-incremental-school-approval-review-only
          path: artifacts/dfw-per-district-capability-review.json
          if-no-files-found: warn
          retention-days: 7
