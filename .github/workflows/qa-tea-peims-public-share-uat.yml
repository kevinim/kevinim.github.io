name: TEA PEIMS public-share UAT validation (no deployment)
on:
  pull_request:
    paths:
      - 'uat/peims-published-share-preview.js'
      - 'uat/peims-published-share-preview.html'
      - 'uat/peims-published-share-preview.css'
      - 'tests/tea-peims-published-share-uat.test.cjs'
      - 'data/tea-ethnicity-2025-26-priority.json'
      - '.github/workflows/qa-tea-peims-public-share-uat.yml'
permissions:
  contents: read
jobs:
  verify:
    name: Validate FERPA-safe published-only share preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/tea-peims-published-share-uat.test.cjs
      - run: node --test tests/tea-peims-priority-campus.test.cjs
