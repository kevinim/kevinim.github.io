name: CFB Lewisville TEA 92 independent QA (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/tea-cfb-lisd-campus-qa-ledger-2026.json'
      - 'tests/tea-cfb-lisd-independent-qa.test.cjs'
      - 'docs/TEA_CFB_LISD_INDEPENDENT_QA_2026-11-11.md'
      - '.github/workflows/qa-cfb-lisd-tea-2026.yml'
      - 'data/tea-ethnicity-2025-26-priority.json'
      - 'tea-ratings-2026.json'
  push:
    branches: [main]
    paths:
      - 'data/tea-cfb-lisd-campus-qa-ledger-2026.json'
      - 'tests/tea-cfb-lisd-independent-qa.test.cjs'
      - 'data/tea-ethnicity-2025-26-priority.json'
      - 'tea-ratings-2026.json'
permissions:
  contents: read
jobs:
  verify-cfb-lisd:
    name: Verify 92 campus IDs, source gaps, and suppression controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/tea-cfb-lisd-independent-qa.test.cjs
