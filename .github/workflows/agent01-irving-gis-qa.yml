name: Agent01 Irving publisher GIS staging (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'scripts/agent01-probe-irving-gis.cjs'
      - 'tests/agent01-*.test.cjs'
      - 'data/dfw-agent01-gis-source-inventory-2026.json'
      - 'docs/AGENT01_DFW_GIS_ACQUISITION_2026-11-09.md'
      - '.github/workflows/agent01-irving-gis-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Agent01 provenance / geometry / cross-source safety QA
        run: node --test tests/agent01-irving-gis-acquisition.test.cjs tests/agent01-irving-embedded-high.test.cjs tests/agent01-dfw-gis-inventory.test.cjs
      - name: Existing school-zone UI and polygon-linkage regression
        run: node --test tests/school-zone-ui.test.cjs tests/school-polygon-linkage-audit.test.cjs
  live-source-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only Irving GIS probe (FAIL CLOSED; never release polygons)
        run: node scripts/agent01-probe-irving-gis.cjs --live
      - name: Retain metadata-only diagnostics (no GIS geometry or addresses uploaded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent01-irving-provenance-only
          path: artifacts/agent01-irving-gis-stage/source-audit.json
          if-no-files-found: warn
          retention-days: 7
