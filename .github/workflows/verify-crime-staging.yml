name: P43 crime staging QA (no UI deployment)

on:
  pull_request:
    paths:
      - 'data/crime/**'
      - 'scripts/check-crime-staging.mjs'
      - '.github/workflows/verify-crime-staging.yml'
  push:
    branches: [main]
    paths:
      - 'data/crime/**'
      - 'scripts/check-crime-staging.mjs'
      - '.github/workflows/verify-crime-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate P43 official aggregates only
        run: node scripts/check-crime-staging.mjs
