name: P43 crime staging QA (no UI deployment)

on:
  pull_request:
    paths:
      - 'data/crime/**'
      - 'scripts/check-crime-staging.mjs'
      - '.github/workflows/verify-crime-staging.yml'
  push:
    branches: [main]
    paths:
      - 'data/crime/**'
      - 'scripts/check-crime-staging.mjs'
      - '.github/workflows/verify-crime-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate P43 official aggregates only
        run: node scripts/check-crime-staging.mjs
