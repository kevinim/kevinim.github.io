name: External API policy contract (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'reviewed.html'
      - 'dashboard-main.js'
      - 'home-lookup-v2.js'
      - 'features/**'
      - 'backend/**'
      - 'scripts/audit-external-api-contract.cjs'
      - 'tests/audit-external-api-contract.test.cjs'
      - 'deploy/environment-plan.json'
      - '.github/workflows/audit-external-api-contract.yml'
  workflow_dispatch:
  schedule:
    - cron: '10 15 * * 1'

concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  audit-external-api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify provider contract tests
        run: node --test tests/audit-external-api-contract.test.cjs
      - name: Audit deployed-source provider markers and disclaimers
        run: node scripts/audit-external-api-contract.cjs
