name: McKinney 2026-27 official Finder source health (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'features/mckinney-finder-crosscheck.js'
      - 'scripts/check-mckinney-official-source-live.mjs'
      - 'tests/mckinney-finder-crosscheck.test.cjs'
      - '.github/workflows/mckinney-official-finder-source-qa.yml'
  workflow_dispatch:
concurrency:
  group: tx-mckinney-source-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  official-finder-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Synthetic campus identity and year checks
        run: node --test tests/mckinney-finder-crosscheck.test.cjs
      - name: Review publisher's live Finder web map and district's 2026-27 map
        run: node scripts/check-mckinney-official-source-live.mjs
