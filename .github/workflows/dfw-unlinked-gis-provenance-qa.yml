name: DFW school GIS provenance and versioned bootstrap QA (no deploy)
on:
  push:
    branches: [qa/dfw-unlinked-gis-provenance-and-bootstrap-20261109]
  pull_request:
    branches: [feature/dallas-isd-official-2026-zone-pilot-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trust-and-provenance:
    name: Read-only GIS vintage, TEA identity and bootstrap security regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned
        with:
          node-version: '24'
      - name: No deployment, no PII, never promote stale GIS
        run: |
          node --check scripts/dashboard-bootstrap-contract.cjs
          node --check scripts/audit-dallas-campus-ids.cjs
          node --test tests/dashboard-bootstrap-contract.test.cjs tests/dfw-unlinked-gis-triage.test.cjs tests/dallas-campus-ids.test.cjs tests/audit-gis-upload-links.test.cjs tests/public-preview-build.test.cjs
          node scripts/audit-gis-upload-links.cjs
          node scripts/verify-main-data.mjs
      - name: Live published Dallas GIS -> TEA campus identity evidence (no addresses/polygons persisted)
        run: node scripts/audit-dallas-campus-ids.cjs
      - name: Attach public school-ID crosswalk report, no geometry or households
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4.6.2
        with:
          name: dallas-tea-campus-crosswalk-audit
          path: ${{ runner.temp }}/dallas-campus-id-crosswalk-audit.json
          if-no-files-found: warn
          retention-days: 14
  browser:
    name: Real Dallas publisher polygons -> Leaflet candidate map 390px/1366px (nonresidential)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned
        with:
          node-version: '24'
      - name: Install isolated free Chromium test dependencies
        run: |
          mkdir -p gis-browser-qa-tmp
          cd gis-browser-qa-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit --ignore-scripts playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Real GIS layer and rendered orange dashed unconfirmed boundaries on mobile and desktop
        env:
          NODE_PATH: ${{ github.workspace }}/gis-browser-qa-tmp/node_modules
        run: node scripts/test-dallas-attendance-browser.cjs
      - name: Attach rendered Leaflet map and candidate screenshots (no address)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4.6.2
        with:
          name: dallas-gis-provisional-browser-390-1366
          path: artifacts/gis-browser/
          if-no-files-found: warn
          retention-days: 14
