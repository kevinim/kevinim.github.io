name: Agent 06 runtime address privacy and static asset QA (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-runtime-privacy-assets.cjs'
      - 'scripts/test-address-privacy-offline-browser.cjs'
      - 'tests/audit-runtime-privacy-assets.test.cjs'
      - '.github/workflows/agent06-runtime-privacy-release-qa.yml'
      - 'index.html'
      - 'reviewed.html'
      - 'home-lookup-v2.js'
      - 'home-lookup.js'
      - 'texas-address-suggest.js'
      - 'candidate-compare.js'
      - 'collin-parcel-check.js'
      - 'school-assignment.js'
      - 'features/theme-toggle.js'
  workflow_dispatch:

concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  audit-and-browser:
    name: Privacy/asset source tests plus offline synthetic browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Negative cases and current runtime audit
        run: |
          node --test tests/audit-runtime-privacy-assets.test.cjs
          node scripts/audit-runtime-privacy-assets.cjs
      - name: Existing security, CSP and provider contract regression
        run: |
          node --test tests/audit-external-api-contract.test.cjs tests/audit-visitor-xss.test.cjs tests/strict-script-csp.test.cjs
          node scripts/audit-external-api-contract.cjs
      - name: Build sanitized preview without deployment
        run: node scripts/build-public-preview.cjs
      - name: Install isolated Chromium browser
        run: |
          mkdir -p agent06-browser-tmp
          cd agent06-browser-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit --ignore-scripts playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify synthetic address clearing, no persistence and map shell while third parties blocked
        run: NODE_PATH="$PWD/agent06-browser-tmp/node_modules" node scripts/test-address-privacy-offline-browser.cjs
      - name: Attach non-sensitive boolean/count evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent06-offline-privacy-flags
          path: artifacts/security/agent06-browser-privacy.json
          if-no-files-found: warn
