name: P42 winter/grid source QA (no map deployment)
on:
  pull_request:
    paths:
      - 'data/resilience/**'
      - 'features/resilience/**'
      - 'tests/p42-resilience-scope.test.cjs'
      - '.github/workflows/verify-p42-resilience.yml'
  push:
    branches: [main]
    paths:
      - 'data/resilience/**'
      - 'features/resilience/**'
      - 'tests/p42-resilience-scope.test.cjs'
      - '.github/workflows/verify-p42-resilience.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/p42-resilience-scope.test.cjs
