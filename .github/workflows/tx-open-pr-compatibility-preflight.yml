name: TX current school integration compatibility preflight (no deploy)
# The November 9 sixteen-branch queue is already merged; re-merging stale branches
# creates false conflicts. Validate the current PR against current main instead.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tx-open-pr-compatibility-preflight.yml'
      - 'district-registry.js'
      - 'trusted-link-policy.js'
      - 'school-zone-ui.js'
      - 'school-assignment.js'
      - 'data/dfw-school-coverage-matrix-2026.json'
      - 'data/tea-texasworks-locality-2026.json'
      - 'scripts/build-dfw-school-coverage-matrix.cjs'
      - 'scripts/verify-residential-school-release.cjs'
      - 'tests/dfw-school-coverage-matrix.test.cjs'
      - 'tests/residential-school-release-gate.test.cjs'
      - 'tests/dfw-comprehensive-source-audit.test.cjs'
  workflow_dispatch:
concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  school-compatibility:
    name: Current PR school matrix, source integrity and residential NO-GO
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify current school matrix and main-integrated sources
        run: |
          node scripts/build-dfw-school-coverage-matrix.cjs --check
          node scripts/verify-main-data.mjs
          node --test tests/dfw-school-coverage-matrix.test.cjs tests/dfw-comprehensive-source-audit.test.cjs tests/audit-school-provenance.test.cjs tests/audit-gis-upload-links.test.cjs tests/residential-school-release-gate.test.cjs tests/public-privacy-disclosure.test.cjs
          node scripts/check-public-personalization.cjs .
      - name: Residential school assignment remains an explicit NO_GO until independently verified
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/verify-residential-school-release.cjs >/tmp/residential-gate.txt 2>&1; then
            echo "::error::Unapproved residential assignment incorrectly marked GO"
            exit 1
          fi
          if ! grep -q '"status":"NO_GO"' /tmp/residential-gate.txt; then
            echo "::error::Expected explicit NO_GO from school release gate"
            cat /tmp/residential-gate.txt
            exit 1
          fi
          echo "CURRENT_SCHOOL_COMPATIBILITY_NO_GO_GUARD_PASS"
