name: TX public release security gate (no deployment)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 14 * * 1'
permissions:
  contents: read
jobs:
  privacy-regression:
    name: Privacy regression and credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test security gate rules
        run: node --test tests/public-release-gate.test.cjs tests/public-preview-build.test.cjs
      - name: Run non-deploying public release audit
        run: node scripts/public-release-gate.cjs audit
      - name: Build and verify isolated public preview (no deploy)
        run: node scripts/verify-public-preview.cjs
      - name: Re-run source audit for final artifact metadata
        run: node scripts/public-release-gate.cjs audit
      - name: Upload redacted audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-release-security-audit
          path: artifacts/security/public-release-audit.json
          if-no-files-found: warn
  pr-change-secrets:
    name: PR change secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan PR change history with Gitleaks Action
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
  full-history-secrets:
    name: ALL refs and full Git history Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete repository history (all refs, redacted results)
        run: |
          docker run --rm --network none \
            -v "$PWD:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --log-opts=--all /repo

  public-preview-browser-qa:
    name: Public preview browser smoke (offline third-party APIs)
    needs: [privacy-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build isolated public preview
        run: node scripts/build-public-preview.cjs
      - name: Install isolated Playwright browser
        run: |
          mkdir -p preview-browser-tmp
          cd preview-browser-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify desktop/mobile privacy and map rendering
        env:
          NODE_PATH: ${{ github.workspace }}/preview-browser-tmp/node_modules
        run: node scripts/test-public-preview-browser.cjs
      - name: Attach browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-preview-browser-evidence
          path: artifacts/security/public-preview-browser.json
          if-no-files-found: warn
