name: DFW non-CFB grade/year school source QA (no deploy)
on:
  pull_request:
    branches:
      - feature/dfw-parent-guidance-next8b-20261109
      - feature/dfw-parent-guidance-batch5-20261109
      - feature/dfw-parent-guidance-batch6-20261109
      - main
    paths:
      - 'district-registry.js'
      - 'data/dfw-school-coverage-matrix-2026.json'
      - 'data/dfw-noncfb-grade-year-source-evidence-2026.json'
      - 'data/dfw-noncfb-campus-transition-evidence-2026.json'
      - 'school-lifecycle.js'
      - 'tests/school-lifecycle-curriculum-2026.test.cjs'
      - 'tests/dfw-noncfb-grade-year-source-quality.test.cjs'
      - '.github/workflows/dfw-noncfb-grade-year-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  district-year-and-public-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Source syntax and deterministic DFW campus census
        run: |
          node --check district-registry.js
          node --check tests/dfw-noncfb-grade-year-source-quality.test.cjs
          node scripts/build-dfw-school-coverage-matrix.cjs --check
      - name: School year warnings, parent links, source and map safety
        run: |
          node --test tests/dfw-noncfb-grade-year-source-quality.test.cjs tests/school-lifecycle-curriculum-2026.test.cjs tests/dfw-school-coverage-matrix.test.cjs tests/west-dfw-official-finder.test.cjs tests/dfw-parent-guidance-batch4.test.cjs tests/trusted-outbound-links.test.cjs
      - name: Public source privacy regression
        run: node scripts/check-public-personalization.cjs .
