name: Mobile layout and school controls browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'ui-action-buttons.css'
      - 'features/first-fold-ux.css'
      - 'home-lookup-v2.js'
      - 'scripts/test-responsive-school-ui.cjs'
      - '.github/workflows/verify-mobile-school-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install isolated Playwright Chromium
        run: |
          mkdir -p responsive-browser-tmp
          cd responsive-browser-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Serve PR website on localhost
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mobile-ui-server.log 2>&1 &
          sleep 2
      - name: Test mobile widths, inline address X and school toggle grouping
        env:
          NODE_PATH: ${{ github.workspace }}/responsive-browser-tmp/node_modules
        run: node scripts/test-responsive-school-ui.cjs
      - name: Upload viewport screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: responsive-school-ui-check
          path: artifacts/responsive-ui/
          if-no-files-found: warn
