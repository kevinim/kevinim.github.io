name: Conditional GO informational-only release scope (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'features/conditional-school-release.js'
      - 'home-lookup-v2.js'
      - 'index.html'
      - 'scripts/verify-conditional-school-scope.cjs'
      - 'scripts/test-conditional-school-browser.cjs'
      - 'tests/conditional-school-release.test.cjs'
      - '.github/workflows/conditional-school-release-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conditional-scope-and-browser:
    name: Informational-only scope; school assignment fail-closed; 390/1366 Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify conditional policy and hard-block unreviewed enrollment
        run: |
          node --check features/conditional-school-release.js
          node --check scripts/verify-conditional-school-scope.cjs
          node --check scripts/test-conditional-school-browser.cjs
          node --test tests/conditional-school-release.test.cjs
          node scripts/verify-conditional-school-scope.cjs
      - name: Independent security, disclosure and source regression
        run: |
          node --test tests/public-privacy-disclosure.test.cjs tests/audit-runtime-privacy-assets.test.cjs tests/strict-script-csp.test.cjs
          node scripts/audit-runtime-privacy-assets.cjs
          node scripts/verify-public-preview.cjs
      - name: Install isolated synthetic-only browser
        run: |
          mkdir -p conditional-browser-tmp
          cd conditional-browser-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit --ignore-scripts playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify real mobile and desktop rendering with no official Finder requests
        run: NODE_PATH="$PWD/conditional-browser-tmp/node_modules" node scripts/test-conditional-school-browser.cjs
      - name: Store redacted flags only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conditional-go-scope-qa
          path: |
            artifacts/release/conditional-scope.json
            artifacts/release/conditional-browser.json
          if-no-files-found: warn
