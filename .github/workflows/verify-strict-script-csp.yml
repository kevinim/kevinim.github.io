name: Strict script CSP and delegated action guard

on:
  pull_request:
    paths:
      - index.html
      - reviewed.html
      - tests/strict-script-csp.test.cjs
      - scripts/test-untrusted-data-browser.cjs
  push:
    branches:
      - security/strict-hash-csp-20261108

concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify CSP hashes, script host and event listener safety
        run: node --test tests/strict-script-csp.test.cjs
