name: Allen McKinney TEA campus source QA (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - data/tea-allen-mckinney-campus-qa-2026.json
      - data/tea-allen-mckinney-academics-2026-source.json
      - data/tea-allen-mckinney-enrollment-2025-26-source.json
      - features/carrollton-school-insights.js
      - features/carrollton-school-insights.css
      - index.html
      - tests/allen-mckinney-tea-ui.test.cjs
      - tests/tea-allen-mckinney-campus-qa.test.cjs
      - docs/TEA_ALLEN_MCKINNEY_CAMPUS_QA_2026-11-11.md
      - .github/workflows/tea-allen-mckinney-campus-qa.yml
permissions:
  contents: read
jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate isolated TEA campus data and source masking
        run: |
          node --check tests/tea-allen-mckinney-campus-qa.test.cjs
          node --test tests/tea-allen-mckinney-campus-qa.test.cjs
          node --test tests/allen-mckinney-tea-ui.test.cjs
          node --test tests/carrollton-school-insights.test.cjs
          node --test tests/tea-campus-enrichment-pipeline.test.cjs
