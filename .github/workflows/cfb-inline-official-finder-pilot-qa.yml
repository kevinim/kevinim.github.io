name: CFB inline official SchoolSearch pilot QA (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'features/cfb-official-inline.js'
      - 'features/cfb-official-bridge.js'
      - 'features/cfb-official-inline.css'
      - 'tests/cfb-official-inline-embed.test.cjs'
      - 'tests/cfb-official-manual-bridge.test.cjs'
      - 'tests/csp-network-allowlist.test.cjs'
      - 'tests/externalized-main-bootstrap.test.cjs'
      - 'scripts/test-cfb-official-inline-live-browser.cjs'
      - '.github/workflows/cfb-inline-official-finder-pilot-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-and-unit:
    name: Narrow CSP and click-only official iframe, no school auto-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: |
          node --check features/cfb-official-inline.js
          node --check features/cfb-official-bridge.js
          node --check tests/externalized-main-bootstrap.test.cjs
          node --test tests/cfb-official-inline-embed.test.cjs tests/cfb-official-manual-bridge.test.cjs tests/cfb-official-rezoning-reference.test.cjs tests/csp-network-allowlist.test.cjs tests/conditional-school-release.test.cjs
          node --test tests/externalized-main-bootstrap.test.cjs
  vendor-browser:
    name: Real local-origin CFB iframe at mobile/desktop; blocked frame is NO_GO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated Chromium
        run: |
          mkdir -p cfb-inline-browser-tmp
          cd cfb-inline-browser-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit --ignore-scripts playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Open official GuideK12 inside local-origin dashboard
        env:
          NODE_PATH: ${{ github.workspace }}/cfb-inline-browser-tmp/node_modules
        run: node scripts/test-cfb-official-inline-live-browser.cjs
