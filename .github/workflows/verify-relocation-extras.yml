name: Integrated workplace and relocation extras browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-lookup-v2.js'
      - 'features/**'
      - 'data/healthcare/**'
      - 'data/resilience/**'
      - 'scripts/test-integrated-features.*'
      - 'scripts/test-integrated-features-browser.cjs'
      - '.github/workflows/verify-relocation-extras.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tested-in-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify icon, preserved controls and cost math
        run: node --test scripts/test-integrated-features.cjs
      - name: Install Chromium into isolated temporary folder
        run: |
          mkdir -p integration-browser-tmp
          cd integration-browser-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Serve PR version
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/extras-site.log 2>&1 &
          sleep 2
      - name: Simulate browser use of toll, hospital and state grid context
        env:
          NODE_PATH: ${{ github.workspace }}/integration-browser-tmp/node_modules
        run: node scripts/test-integrated-features-browser.cjs
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relocation-extras-browser
          path: artifacts/feature-integration/
          if-no-files-found: warn
