name: Audit Actions write scopes (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/audit-actions-write-scopes.cjs'
      - 'tests/audit-actions-write-scopes.test.cjs'
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * 3'
concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  audit-actions-write-scopes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test audit against unsafe workflow examples
        run: node --test tests/audit-actions-write-scopes.test.cjs
      - name: Read-only scan of repository GitHub Actions permissions
        run: node scripts/audit-actions-write-scopes.cjs
