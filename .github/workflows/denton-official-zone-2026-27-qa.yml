name: Denton ISD 2026-27 official PDF source and browser QA (no deploy)
on:
  push:
    branches: [feature/denton-isd-2026-27-official-zone-fallback-20261109]
  pull_request:
    branches: [qa/dfw-unlinked-gis-provenance-and-bootstrap-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    name: Denton 39 district PDFs, TEA IDs, no-false-GIS and security policy
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned
        with:
          node-version: '24'
      - name: Denton map references never substitute PDF for verified GIS or residence
        run: |
          node --check denton-official-zone-references.js
          node --check dashboard-main.js
          node --test tests/denton-official-zone-references.test.cjs tests/dashboard-bootstrap-contract.test.cjs
          node scripts/audit-gis-upload-links.cjs
          node scripts/verify-main-data.mjs
  browser:
    name: Real Denton 39-source PDF selector and zero fake GIS polygons (390/1366px)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned
        with:
          node-version: '24'
      - name: Install isolated free Chromium
        run: |
          mkdir -p denton-browser-qa-tmp
          cd denton-browser-qa-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit --ignore-scripts playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Open real Denton school PDF source selector without residence or GIS estimation
        env:
          NODE_PATH: ${{ github.workspace }}/denton-browser-qa-tmp/node_modules
        run: node scripts/test-denton-official-zone-browser.cjs
      - name: Upload 390px and 1366px source-map UI evidence, no home addresses
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned
        with:
          name: denton-2026-27-source-map-ui-390-1366
          path: artifacts/denton-browser/
          if-no-files-found: warn
          retention-days: 14
