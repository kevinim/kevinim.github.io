name: Denton 39 campus marker PDF and provenance Track B (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'features/denton-campus-marker-info.js'
      - 'denton-campus-point-quality.js'
      - 'data/denton-campus-public-points-2026.json'
      - 'data/denton-eight-campus-coordinate-exceptions-2026.json'
      - 'index.html'
      - 'tests/denton-campus-marker-provenance.test.cjs'
      - 'scripts/test-denton-track-b-marker-browser.cjs'
      - '.github/workflows/denton-marker-reference-track-b.yml'
  push:
    branches: [main]
    paths:
      - 'features/denton-campus-marker-info.js'
      - 'index.html'
  workflow_dispatch:
concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  source:
    name: Strict Denton 39 campus identity, 31/8 provenance and zero residential grants
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Pure source data and explicit reference warning
        run: |
          node --check features/denton-campus-marker-info.js
          node --check scripts/test-denton-track-b-marker-browser.cjs
          node --test tests/denton-campus-marker-provenance.test.cjs tests/denton-official-zone-references.test.cjs tests/conditional-school-release.test.cjs
      - name: Original dashboard unchanged and strict CSP
        run: node --test tests/externalized-main-bootstrap.test.cjs tests/csp-network-allowlist.test.cjs tests/trusted-outbound-links.test.cjs
  browser:
    name: Actual Leaflet campus markers, PDFs and 31/8 warnings, mobile/desktop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Isolated Playwright and Chromium
        run: |
          mkdir -p denton-markers-playwright-tmp
          cd denton-markers-playwright-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit --ignore-scripts playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Public campus, school marker click, exact official PDF and source warning
        env:
          NODE_PATH: ${{ github.workspace }}/denton-markers-playwright-tmp/node_modules
        run: node scripts/test-denton-track-b-marker-browser.cjs
      - name: Save public school screenshots and aggregate read-only QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: denton-39-campus-track-b-browser-390-1366
          path: |
            artifacts/denton-trackb-campuses/*.png
          if-no-files-found: warn
          retention-days: 7
