name: Regional UI, collapsible comparison and color-theme QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'features/area-assessment*'
      - 'features/region-compare*'
      - 'features/theme-toggle*'
      - 'data/area-noaa-counts-2024-2025.json'
      - 'data/noaa-storm-events-dfw-2024-2025.json'
      - 'tests/area-assessment.test.cjs'
      - 'tests/area-regional-coverage.test.cjs'
      - 'tests/region-compare.test.cjs'
      - 'tests/theme-collapse.test.cjs'
      - 'tests/area-noaa-summary.test.cjs'
      - 'scripts/test-area-assessment-browser.cjs'
      - 'scripts/test-region-compare-browser.cjs'
      - 'scripts/test-theme-collapse-browser.cjs'
      - '.github/workflows/verify-area-assessment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regional-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Unit rules and source freshness
        run: node --test tests/area-assessment.test.cjs tests/area-noaa-summary.test.cjs tests/area-regional-coverage.test.cjs tests/region-compare.test.cjs tests/theme-collapse.test.cjs
      - name: Existing main-map verification
        run: node scripts/verify-main-data.mjs
      - name: Install isolated Chromium
        run: |
          mkdir -p area-qa-browser-deps
          cd area-qa-browser-deps
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Serve PR website on localhost
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/area-assessment-server.log 2>&1 &
          sleep 2
      - name: Real desktop/mobile interaction and Allen marker checks
        env:
          NODE_PATH: ${{ github.workspace }}/area-qa-browser-deps/node_modules
        run: |
          node scripts/test-area-assessment-browser.cjs
          node scripts/test-region-compare-browser.cjs
          node scripts/test-theme-collapse-browser.cjs
      - name: Save screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: area-assessment-browser-qa
          path: |
            artifacts/area-assessment/
            artifacts/region-compare/
            artifacts/theme-ui/
          if-no-files-found: warn
