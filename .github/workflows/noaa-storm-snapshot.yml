name: NOAA DFW storm history snapshot
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/refresh-noaa-storm-events.cjs'
      - '.github/workflows/noaa-storm-snapshot.yml'
      - 'tests/snapshot-workflow-security.test.cjs'
      - 'noaa-storm-history.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate builder syntax and read-only snapshot policy
        run: |
          node --check scripts/refresh-noaa-storm-events.cjs
          node --test tests/snapshot-workflow-security.test.cjs
  build-snapshot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Download official NOAA files and validate DFW county-year totals
        run: node scripts/refresh-noaa-storm-events.cjs
      - name: Check NOAA data, source SHA-256 and monthly reconciliation
        run: |
          node - <<'NODE'
          const d=require('./data/noaa-storm-events-dfw-2024-2025.json');
          const assert=require('node:assert/strict');
          assert.equal(d.metadata.analyzedYears.length,2);
          assert.equal(d.metadata.counties.length,12);
          assert.ok(d.metadata.selectedEvents>200);
          assert.ok(d.metadata.sourceFiles.every(s=>s.sha256.length===64 && s.rawRows>1000));
          assert.equal(d.summary.reduce((n,r)=>n+r.count,0),d.metadata.selectedEvents);
          assert.ok(d.summary.every(r=>r.monthly.reduce((a,b)=>a+b,0)===r.count));
          console.log('PASS NOAA source digest/aggregation check',d.metadata.selectedEvents);
          NODE
      - name: Attach NOAA source audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noaa-storm-history-dfw-2024-2025
          path: data/noaa-storm-events-dfw-2024-2025.json
          if-no-files-found: warn

