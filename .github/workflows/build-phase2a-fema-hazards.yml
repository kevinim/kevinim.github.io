name: Phase 2A build FEMA 2025 tract snapshot
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-phase2a-fema-hazards.mjs'
      - '.github/workflows/build-phase2a-fema-hazards.yml'
      - 'tests/snapshot-workflow-security.test.cjs'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate builder syntax and read-only snapshot policy
        run: |
          node --check scripts/build-phase2a-fema-hazards.mjs
          node --test tests/snapshot-workflow-security.test.cjs
  build-snapshot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Extract only selected DFW 2025 NRI tract source (FEMA)
        run: node scripts/build-phase2a-fema-hazards.mjs
      - name: Validate static output exists, not a placeholder
        run: |
          test -s data/phase2a-fema-nri-dfw-2025.geojson
          node -e "const j=JSON.parse(require('node:fs').readFileSync('data/phase2a-fema-nri-dfw-2025.geojson','utf8'));if(j.features.length<1000||Object.keys(j.metadata.coverageCounties).length!==12)process.exit(1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase2a-fema-dfw-tract-snapshot
          path: data/phase2a-fema-nri-dfw-2025.geojson
          retention-days: 14
