name: Phase 2A build FEMA 2025 tract snapshot
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-phase2a-fema-hazards.mjs'
      - '.github/workflows/build-phase2a-fema-hazards.yml'
  workflow_dispatch:
jobs:
  build-snapshot:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract only selected DFW 2025 NRI tract source (FEMA)
        run: node scripts/build-phase2a-fema-hazards.mjs
      - name: Validate static output exists, not a placeholder
        run: |
          test -s data/phase2a-fema-nri-dfw-2025.geojson
          node -e "const j=require('./data/phase2a-fema-nri-dfw-2025.geojson');if(j.features.length<1000||Object.keys(j.metadata.coverageCounties).length!==12)process.exit(1)"
      - name: Commit verified small static geojson to feature branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add data/phase2a-fema-nri-dfw-2025.geojson
          if ! git diff --cached --quiet; then
            git commit -m 'data: materialize official 2025 FEMA NRI DFW hazard tracts'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: phase2a-fema-dfw-tract-snapshot
          path: data/phase2a-fema-nri-dfw-2025.geojson
          retention-days: 14
