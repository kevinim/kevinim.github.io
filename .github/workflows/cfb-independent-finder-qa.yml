name: CFB independent Finder and polygon QA (OFFLINE, NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/cfb-independent-finder-qa.cjs'
      - 'tests/cfb-independent-finder-qa.test.cjs'
      - 'docs/CFB_INDEPENDENT_FINDER_QA_AG04_2026-11-10.md'
      - '.github/workflows/cfb-independent-finder-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-offline-qa:
    name: Native-selection, grade, geometry and privacy fail-closed tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check evaluator syntax
        run: node --check scripts/cfb-independent-finder-qa.cjs
      - name: Offline synthetic logic regression; no GuideK12 network traffic
        run: node --test tests/cfb-independent-finder-qa.test.cjs
      - name: Explicit baseline with zero independently observed public properties
        run: |
          node scripts/cfb-independent-finder-qa.cjs > /tmp/cfb-ag04-empty-baseline.json
          node -e "const r=require('/tmp/cfb-ag04-empty-baseline.json'); if(r.samples!==0 || r.totals.pass!==0 || r.totals.fail!==0 || r.totals.finderObservedGradeResults!==0 || r.schoolAssignmentApproved!==false) process.exit(1)"
