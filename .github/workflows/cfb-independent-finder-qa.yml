name: CFB independent Finder and polygon QA (OFFLINE, NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/cfb-independent-finder-qa.cjs'
      - 'tests/cfb-independent-finder-qa.test.cjs'
      - 'docs/CFB_INDEPENDENT_FINDER_QA_AG04_2026-11-10.md'
      - '.github/workflows/cfb-independent-finder-qa.yml'
      - 'scripts/cfb-independent-live-finder.cjs'
  workflow_dispatch:
concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  independent-offline-qa:
    name: Native-selection, grade, geometry and privacy fail-closed tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check evaluator syntax
        run: node --check scripts/cfb-independent-finder-qa.cjs
      - name: Offline synthetic logic regression; no GuideK12 network traffic
        run: node --test tests/cfb-independent-finder-qa.test.cjs
      - name: Explicit baseline with zero independently observed public properties
        run: |
          node scripts/cfb-independent-finder-qa.cjs > /tmp/cfb-ag04-empty-baseline.json
          node -e "const r=require('/tmp/cfb-ag04-empty-baseline.json'); if(r.samples!==0 || r.totals.pass!==0 || r.totals.fail!==0 || r.totals.finderObservedGradeResults!==0 || r.schoolAssignmentApproved!==false) process.exit(1)"
  independent-live-browser:
    name: Live public Finder native address selection and E/M/H recheck (no GIS)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated free Chromium and Playwright
        run: |
          mkdir -p cfb-ag04-browser-tmp
          cd cfb-ag04-browser-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit --ignore-scripts playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify exactly two public property native Finder results with explicit grade labels
        env:
          NODE_PATH: ${{ github.workspace }}/cfb-ag04-browser-tmp/node_modules
        run: node scripts/cfb-independent-live-finder.cjs
      - name: Upload redacted live grade-level evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-ag04-independent-real-finder-E-M-H-redacted
          path: artifacts/cfb-ag04/independent-live-finder-redacted.json
          if-no-files-found: warn
          retention-days: 7
