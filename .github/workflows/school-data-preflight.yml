name: TX school data snapshot and release preflight (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard-main.js'
      - 'home-lookup-v2.js'
      - 'district-registry.js'
      - 'school-identity.js'
      - 'school-assignment.js'
      - 'school-zone-ui.js'
      - 'data/**'
      - 'features/cfb-*'
      - 'features/tea-*'
      - 'features/dfw-school*'
      - 'scripts/school-data-release-preflight.cjs'
      - 'tests/school-data-release-preflight.test.cjs'
      - '.github/workflows/school-data-preflight.yml'
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  school-data-preflight:
    name: School source integrity, versions and polygon safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify source hash lock, source vintage and geometry
        run: node scripts/school-data-release-preflight.cjs
      - name: Test validator, fail-closed cases and real dataset
        run: node --test tests/school-data-release-preflight.test.cjs
      - name: Upload address-free, provenance-aware QA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: school-data-release-preflight-report
          path: artifacts/school-data/school-data-preflight.json
          if-no-files-found: warn
