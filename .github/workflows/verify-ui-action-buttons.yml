name: TX feature button UI QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'ui-action-buttons.css'
      - 'scripts/check-ui-feature-controls.cjs'
      - '.github/workflows/verify-ui-action-buttons.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ui-action-buttons.css'
      - 'scripts/check-ui-feature-controls.cjs'
      - '.github/workflows/verify-ui-action-buttons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-ui-feature-controls.cjs
