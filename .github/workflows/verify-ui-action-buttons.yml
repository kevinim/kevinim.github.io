name: TX feature button UI QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'ui-action-buttons.css'
      - 'scripts/check-ui-feature-controls.cjs'
      - '.github/workflows/verify-ui-action-buttons.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ui-action-buttons.css'
      - 'scripts/check-ui-feature-controls.cjs'
      - '.github/workflows/verify-ui-action-buttons.yml'
  workflow_dispatch:
concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  static-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/check-ui-feature-controls.cjs
