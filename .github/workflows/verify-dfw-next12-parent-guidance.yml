name: DFW next-12 official school guidance and GIS no-inference QA
on:
  pull_request:
    branches:
      - main
      - feature/dfw-parent-guidance-top8-20261109
    paths:
      - 'district-registry.js'
      - 'trusted-link-policy.js'
      - 'data/dfw-school-coverage-matrix-2026.json'
      - 'tests/dfw-parent-guidance-next12.test.cjs'
      - 'tests/dfw-school-coverage-matrix.test.cjs'
      - '.github/workflows/verify-dfw-next12-parent-guidance.yml'
  workflow_dispatch:
concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify-official-parent-sources:
    name: DFW official parent links, TEA matrix and no-GIS-inference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate static scripts and generated TEA snapshot
        run: |
          node --check district-registry.js
          node --check trusted-link-policy.js
          node scripts/build-dfw-school-coverage-matrix.cjs --check
      - name: Verify twelve official sources, old 8 sources and all trusted outbound links
        run: |
          node --test tests/dfw-school-coverage-matrix.test.cjs tests/dfw-parent-guidance-next12.test.cjs tests/dfw-neighbor-finders.test.cjs tests/trusted-outbound-links.test.cjs
      - name: Fail closed on known personalized commute artifacts
        run: node scripts/check-public-personalization.cjs .
