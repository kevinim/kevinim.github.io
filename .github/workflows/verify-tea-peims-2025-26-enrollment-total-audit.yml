name: Independent TEA 2025-26 PEIMS total enrollment audit
on:
  pull_request:
    paths:
      - 'data/tea-peims-2025-26-enrollment-total-audit-allen-mckinney.json'
      - 'tests/tea-peims-enrollment-total-audit-allen-mckinney.test.cjs'
      - '.github/workflows/verify-tea-peims-2025-26-enrollment-total-audit.yml'
      - 'docs/TEA_PEIMS_2025-26_ENROLLMENT_AUDIT_ALLEN_MCKINNEY.md'
  push:
    branches:
      - 'data/tea-peims-2025-26-enrollment-total-audit-20261111'
permissions:
  contents: read
jobs:
  peims-enrollment-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tea-peims-enrollment-total-audit-allen-mckinney.test.cjs
