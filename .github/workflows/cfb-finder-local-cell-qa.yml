name: CFB local Finder evidence cells — offline negative QA
on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/build-cfb-finder-derived-cells.cjs'
      - 'tests/cfb-finder-derived-cells.test.cjs'
      - '.github/workflows/cfb-finder-local-cell-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-is-never-authoritative-or-auto-published:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Syntax validation
        run: |
          node --check scripts/build-cfb-finder-derived-cells.cjs
          node --check tests/cfb-finder-derived-cells.test.cjs
      - name: Synthetic geospatial and fail-closed publication QA
        run: |
          node --test tests/cfb-finder-derived-cells.test.cjs
      - name: Public-source privacy regression
        run: node scripts/check-public-personalization.cjs .
