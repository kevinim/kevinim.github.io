name: Agent 04 independent DFW district data integrity (no deploy)
on:
  pull_request:
    paths:
      - 'scripts/audit-dfw-district-integrity.cjs'
      - 'scripts/probe-dfw-official-links.cjs'
      - 'tests/dfw-district-integrity.test.cjs'
      - 'tests/dfw-finder-http.test.cjs'
      - 'data/dfw-campus-identity-baseline-2026.json'
      - 'tea-ratings-2026.json'
      - 'nces-locations-2024.json'
      - 'schools.json'
      - 'district-registry.js'
      - 'school-lifecycle.js'
      - 'school-data-provenance.json'
      - 'data/dfw-school-coverage-matrix-2026.json'
      - 'data/school-polygon-linkage-baseline.json'
      - '.github/workflows/agent04-dfw-district-data-integrity.yml'
  workflow_dispatch:
    inputs:
      live_http_probe:
        description: 'HEAD-only official link liveness check (not address assignment)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  district-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 pinned
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Syntax checks
        run: |
          node --check scripts/audit-dfw-district-integrity.cjs
          node --check scripts/probe-dfw-official-links.cjs
          node --check tests/dfw-district-integrity.test.cjs
          node --check tests/dfw-finder-http.test.cjs
      - name: Campus census, duplicate and disappearance negative tests
        run: node --test tests/dfw-district-integrity.test.cjs tests/dfw-finder-http.test.cjs
      - name: Emit district-by-district and campus-by-campus offline audit
        run: node scripts/audit-dfw-district-integrity.cjs
      - name: Record official links without making a network claim
        run: node scripts/probe-dfw-official-links.cjs
      - name: Optional HTTP-only live link probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_http_probe }}
        run: node scripts/probe-dfw-official-links.cjs --live
      - name: Retain auditable JSON evidence (no private home addresses)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: agent04-dfw-108-isd-data-and-http
          path: |
            artifacts/agent04-dfw-district-integrity.json
            artifacts/agent04-dfw-finder-link-http.json
          if-no-files-found: warn
          retention-days: 7
