name: DFW official source link repairs (QA-only, no deploy)
on:
  pull_request:
    branches:
      - feature/dfw-parent-guidance-remaining22-20261109
      - main
    paths:
      - 'district-registry.js'
      - 'trusted-link-policy.js'
      - 'scripts/audit-gis-upload-links.cjs'
      - 'data/dfw-neighbor-official-school-links-2026.json'
      - 'data/dfw-school-coverage-matrix-2026.json'
      - 'data/dfw-canonical-parent-links-remediation-2026.json'
      - 'scripts/probe-canonical-dfw-parent-link-repairs.cjs'
      - 'tests/dfw-source-route-canonical-repair.test.cjs'
      - 'tests/dfw-canonical-parent-link-probe.test.cjs'
      - '.github/workflows/dfw-official-source-link-repair-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned checkout v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned setup-node v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Syntax checks
        run: |
          node --check scripts/probe-canonical-dfw-parent-link-repairs.cjs
          node --check tests/dfw-source-route-canonical-repair.test.cjs
          node --check tests/dfw-canonical-parent-link-probe.test.cjs
      - name: Validate both source repairs and whole 107 ISD guidance inventory
        run: |
          node --test tests/dfw-source-route-canonical-repair.test.cjs tests/dfw-canonical-parent-link-probe.test.cjs tests/dfw-neighbor-finders.test.cjs tests/dfw-parent-guidance-batch7.test.cjs tests/dfw-school-coverage-matrix.test.cjs tests/dfw-comprehensive-source-audit.test.cjs
          node scripts/build-dfw-school-coverage-matrix.cjs --check
          node scripts/audit-dfw-comprehensive.cjs
      - name: Check new parent-facing official pages by read-only HTTP GET
        run: node scripts/probe-canonical-dfw-parent-link-repairs.cjs --live
      - name: Upload audit evidence (no residential data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned upload-artifact v4
        with:
          name: dfw-canonical-official-parent-source-repairs
          path: |
            artifacts/dfw-canonical-parent-link-repair-http.json
            artifacts/dfw-integrated-source-audit.json
          if-no-files-found: warn
          retention-days: 7
