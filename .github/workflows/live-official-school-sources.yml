name: Public school source crosschecks (no browser agent)
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'district-registry.js'
      - 'school-zone-ui.js'
      - 'home-lookup-v2.js'
      - 'trusted-link-policy.js'
      - 'features/cfb-*'
      - 'features/dfw-school*'
      - 'data/dfw-*'
      - 'data/cfb-*'
      - 'scripts/check-official-source-health-live.mjs'
      - 'scripts/check-public-address-finders-live.mjs'
      - 'scripts/check-plano-feeder-zones-live.mjs'
      - 'scripts/check-plano-public-address-layer-live.mjs'
      - 'scripts/check-cfb-feeder-source-drift-live.mjs'
      - 'scripts/check-lisd-budget-suites-source-drift-live.mjs'
      - '.github/workflows/live-official-school-sources.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-official-school-sources.yml'
      - 'scripts/check-official-source-health-live.mjs'
concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  verify-public-sources:
    name: GIS, public address samples and source health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Inspect district source availability (advisory, not address-zone certification)
        run: node scripts/check-official-source-health-live.mjs
      - name: Recheck Frisco and Prosper public institutional address samples
        run: node scripts/check-public-address-finders-live.mjs
      - name: Recheck Plano current-linked GIS against district-published feeder paths
        run: node scripts/check-plano-feeder-zones-live.mjs
      - name: Check Plano single PUBLIC address via district Finder-linked per-level ArcGIS point query
        run: node scripts/check-plano-public-address-layer-live.mjs
      - name: Crosscheck three CFB 2026–27 official Farmers Branch feeder pages (advisory)
        run: node scripts/check-cfb-feeder-source-drift-live.mjs
      - name: Recheck public LISD Budget Suites 5289 / 2175 apartment source rows (advisory)
        run: node scripts/check-lisd-budget-suites-source-drift-live.mjs
      - name: Upload source health report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-school-source-health
          path: |
            artifacts/official-school-source-health.json
            artifacts/plano-public-address-arcgis-check.json
            artifacts/cfb-farmers-branch-source-drift.json
            artifacts/lisd-5289-budget-suites-source-drift.json
          if-no-files-found: warn
