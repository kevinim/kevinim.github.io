name: Zoom-aware map place labels
on:
  pull_request:
    branches: [main]
    paths:
      - 'dashboard-main.js'
      - 'index.html'
      - 'features/map/**'
      - 'tests/map-area-label-hierarchy.test.cjs'
      - '.github/workflows/verify-area-label-hierarchy.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard-main.js'
      - 'index.html'
      - 'features/map/**'
      - 'tests/map-area-label-hierarchy.test.cjs'
      - '.github/workflows/verify-area-label-hierarchy.yml'
permissions:
  contents: read
jobs:
  map-label-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --check dashboard-main.js
      - run: node --check features/map/area-label-hierarchy.js
      - run: node --test tests/map-area-label-hierarchy.test.cjs tests/school-grade-focus.test.cjs
