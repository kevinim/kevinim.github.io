name: Production Pages live browser smoke
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test-production-browser.cjs'
      - '.github/workflows/production-browser-smoke.yml'
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  production-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser
        run: |
          mkdir -p production-browser-tmp
          cd production-browser-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify LIVE GitHub Pages map, school polygons and FEMA NFHL service
        env:
          NODE_PATH: ${{ github.workspace }}/production-browser-tmp/node_modules
          DASHBOARD_BASE_URL: https://kevinim.github.io/
        run: node scripts/test-production-browser.cjs
      - name: Attach production browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-pages-browser-smoke
          path: artifacts/production-browser/
          if-no-files-found: warn
