name: TEA PEIMS published-only share integrated browser UAT (no deploy)
on:
  pull_request:
    paths:
      - 'index.html'
      - 'features/tea-peims-public-share-addon.js'
      - 'features/tea-peims-public-share-addon.css'
      - 'tests/tea-peims-public-share-integrated-uat.test.cjs'
      - 'scripts/test-tea-peims-public-share-browser.cjs'
      - 'data/tea-ethnicity-2025-26-priority.json'
      - '.github/workflows/qa-tea-peims-public-share-integrated-uat.yml'
permissions:
  contents: read
jobs:
  source-and-browser:
    name: 2,282-campus privacy QA plus real desktop and mobile screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Published-count subtotal, source safeguards, and regression tests
        run: |
          node --test tests/tea-peims-public-share-integrated-uat.test.cjs
          node --test tests/tea-peims-priority-campus.test.cjs
      - name: Install isolated Chromium browser runner
        run: |
          mkdir -p teapeims-browser-tmp
          cd teapeims-browser-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit --ignore-scripts playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Serve exact PR checkout on loopback only
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tea-public-share-uat-server.log 2>&1 &
          sleep 2
      - name: Verify 1280 and 390 school detail click, suppression, charts, privacy
        env:
          NODE_PATH: ${{ github.workspace }}/teapeims-browser-tmp/node_modules
        run: node scripts/test-tea-peims-public-share-browser.cjs
      - name: Keep responsive screenshots and report for UAT review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tea-peims-public-subtotal-uatscreenshots
          path: artifacts/tea-public-share-uat/
          if-no-files-found: warn
