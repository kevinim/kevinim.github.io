name: Plano Lewisville McKinney real residence and official Finder UAT (no deploy)
on:
  push:
    branches: [qa/plano-lewisville-mckinney-real-finder-20261109]
  pull_request:
    branches: [qa/public-residential-e2e-school-map-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-residential-source-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Strict syntax check
        run: node --check scripts/triage-next3-public-residential-school-browser.cjs
      - name: Isolated Playwright Chromium install (free, no service keys)
        run: |
          mkdir -p next3-browser-temp
          cd next3-browser-temp
          npm init -y >/dev/null
          npm install --no-fund --no-audit --ignore-scripts playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Actual house address -> app school markers and polygons; district Finder controls
        env:
          NODE_PATH: ${{ github.workspace }}/next3-browser-temp/node_modules
        run: node scripts/triage-next3-public-residential-school-browser.cjs
      - name: Archive every evidence report and desktop-mobile screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4
        with:
          name: next3-plano-lisd-mckinney-public-residence-browser-evidence
          path: artifacts/next3-residential-qa/
          if-no-files-found: warn
          retention-days: 7
