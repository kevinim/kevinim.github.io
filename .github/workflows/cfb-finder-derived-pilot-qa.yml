name: CFB Finder-derived boundary pilot QA (no deploy)
on:
  pull_request:
    paths:
      - 'school-zone-ui.js'
      - 'scripts/validate-cfb-finder-derived-boundaries.cjs'
      - 'tests/finder-derived-boundary-provenance.test.cjs'
      - 'data/cfb-finder-derived-boundaries.json'
      - '.github/workflows/cfb-finder-derived-pilot-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cfb-estimate-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: node --test tests/finder-derived-boundary-provenance.test.cjs
      - name: Fail closed if a candidate dataset is supplied without evidence
        run: |
          if test -f data/cfb-finder-derived-boundaries.json; then
            node scripts/validate-cfb-finder-derived-boundaries.cjs
          else
            echo "No candidate CFB estimated polygon dataset: nothing to publish"
          fi
