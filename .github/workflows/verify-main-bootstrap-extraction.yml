name: TX main bootstrap extraction and sanitized public preview QA (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard-main.js'
      - 'scripts/build-public-preview.cjs'
      - 'scripts/verify-public-preview.cjs'
      - 'tests/externalized-main-bootstrap.test.cjs'
      - 'tests/strict-script-csp.test.cjs'
      - 'tests/public-preview-build.test.cjs'
      - '.github/workflows/verify-main-bootstrap-extraction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  script-integrity-and-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Exact source extraction and syntax
        run: |
          node --check dashboard-main.js
          node --check scripts/build-public-preview.cjs
          node --test tests/externalized-main-bootstrap.test.cjs tests/strict-script-csp.test.cjs tests/public-preview-build.test.cjs
      - name: Existing code and privacy-sanitized public preview regression
        run: |
          node scripts/verify-main-data.mjs
          node scripts/verify-public-preview.cjs
          node --test scripts/test-integrated-features.cjs scripts/test-healthcare-winter-map.cjs
  offline-browser-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated pinned Playwright and Leaflet
        run: |
          mkdir -p bootstrap-browser-tmp
          cd bootstrap-browser-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit --ignore-scripts playwright@1.65.0 leaflet@1.9.4
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Serve staged site on loopback
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tx-bootstrap-smoke.log 2>&1 &
          echo $! > /tmp/tx-bootstrap-server.pid
      - name: Verify external JS loads once and map/ZIP/school interactions at 390/1280
        env:
          NODE_PATH: ${{ github.workspace }}/bootstrap-browser-tmp/node_modules
        run: node scripts/test-externalized-main-browser.cjs
      - name: Build curated public preview and test browser isolation without publishing
        env:
          NODE_PATH: ${{ github.workspace }}/bootstrap-browser-tmp/node_modules
        run: |
          node scripts/build-public-preview.cjs
          node scripts/test-public-preview-browser.cjs
