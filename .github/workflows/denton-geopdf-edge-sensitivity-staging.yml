name: Denton GeoPDF-derived boundary edge sensitivity (STAGING ONLY)
on:
  pull_request:
    branches:
      - poc/denton-2026-pdf-to-gis-20261109
    paths:
      - 'scripts/denton_geopdf_edge_sensitivity_qa.py'
      - 'tests/test_denton_geopdf_edge_sensitivity.py'
      - '.github/workflows/denton-geopdf-edge-sensitivity-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edge-sensitivity:
    name: Regenerate 39 official PDF-derived staging polygons and calculate boundary risk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned free geospatial tools
        run: python -m pip install --disable-pip-version-check --no-cache-dir pymupdf==1.26.7 numpy==2.2.6 pyproj==3.7.2 shapely==2.1.2
      - name: Synthetic edge test and strict unlicensed source gates
        run: python -m unittest discover -s tests -p 'test_denton_geopdf_edge_sensitivity.py' -v
      - name: Download published official PDFs and inspect their geospatial geometry
        run: |
          python scripts/denton_pdf_vector_poc.py --out artifacts/denton-pdf-vector-poc
          python scripts/denton_pdf_geopdf_probe.py
          python scripts/denton_pdf_polygon_topology_debug.py
          python scripts/denton_geopdf_to_geojson.py --out artifacts/denton-geopdf-derived
      - name: Revalidate exact 39 IDs, zero same-grade overlaps and 9 original public Census holdouts
        run: |
          python scripts/verify_denton_geopdf_staging.py
          python scripts/denton_geopdf_census_holdout_qa.py
      - name: Analyze 39 school-border offset risks and street-to-zone-boundary distances
        run: python scripts/denton_geopdf_edge_sensitivity_qa.py
      - name: Store only aggregate review evidence; NEVER upload derived GIS or official PDFs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: denton-pdf-39-zone-edge-risk-summary-STAGING
          path: artifacts/denton-geopdf-derived/edge-sensitivity-summary-STAGING.json
          if-no-files-found: warn
          retention-days: 7
