name: DFW batch 5 parent source integrity (read-only)
on:
  push:
    branches: [feature/dfw-parent-guidance-batch5-20261109]
  pull_request:
    branches: [main]
    paths:
      - 'district-registry.js'
      - 'data/dfw-parent-source-evidence-batch5-2026.json'
      - 'data/dfw-school-coverage-matrix-2026.json'
      - 'scripts/audit-school-provenance.cjs'
      - 'tests/dfw-parent-guidance-batch5.test.cjs'
      - '.github/workflows/dfw-parent-source-batch5-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    name: Parent route integrity, source-vintage and school-map no-go
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: '24'
      - name: Check JavaScript syntax and reproducible snapshot
        run: |
          node --check district-registry.js
          node --check scripts/audit-school-provenance.cjs
          node --check tests/dfw-parent-guidance-batch5.test.cjs
          node scripts/build-dfw-school-coverage-matrix.cjs --check
      - name: Run parent sources, exact-host security and map fail-closed tests
        run: |
          node --test tests/dfw-parent-guidance-batch5.test.cjs tests/dfw-parent-guidance-batch4.test.cjs tests/dfw-parent-guidance-batch3.test.cjs tests/dfw-parent-guidance-next12.test.cjs tests/dfw-school-coverage-matrix.test.cjs tests/audit-school-provenance.test.cjs tests/audit-gis-upload-links.test.cjs tests/dfw-neighbor-finders.test.cjs tests/school-zone-ui.test.cjs
