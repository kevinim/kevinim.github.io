name: Dallas ISD published campus polygon source validation
on:
  push:
    branches: [feature/dallas-isd-official-2026-zone-pilot-20261109]
  pull_request:
    branches: [main]
    paths:
      - 'dallas-attendance-live.js'
      - 'scripts/probe-dallas-attendance-live.cjs'
      - 'tests/dallas-attendance-live.test.cjs'
      - '.github/workflows/dallas-attendance-public-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dallas-publisher:
    name: Publisher ArcGIS 3-level source and independent provenance gates
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned
        with:
          node-version: '24'
      - name: Syntax and fail-closed units
        run: |
          node --check dallas-attendance-live.js
          node --check dashboard-main.js
          node --check home-lookup-v2.js
          node --check district-registry.js
          if ! node scripts/build-dfw-school-coverage-matrix.cjs --check; then
            node scripts/build-dfw-school-coverage-matrix.cjs
            git --no-pager diff -- data/dfw-school-coverage-matrix-2026.json | head -n 180
            exit 1
          fi
          node --check scripts/probe-dallas-attendance-live.cjs
          node --test tests/dallas-attendance-live.test.cjs tests/dallas-school-map-integration.test.cjs tests/home-assignment-map.test.cjs tests/dfw-home-automation-readiness.test.cjs tests/school-zone-ui.test.cjs tests/dfw-school-coverage-matrix.test.cjs tests/dfw-school-coverage-runtime.test.cjs
      - name: Read 2026-updated Dallas ArcGIS public polygons and validate complete 3-level source
        run: node scripts/probe-dallas-attendance-live.cjs
  browser:
    name: Browser Dallas publisher polygons, no home address (390/1366px)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned
        with:
          node-version: '24'
      - name: Isolated Chromium for two viewport cases
        run: |
          mkdir -p dallas-browser-tmp
          cd dallas-browser-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit --ignore-scripts playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Public Dallas 187 GIS → candidate-school map, without private addresses
        env:
          NODE_PATH: ${{ github.workspace }}/dallas-browser-tmp/node_modules
        run: node scripts/test-dallas-attendance-browser.cjs
