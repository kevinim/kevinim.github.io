name: CFB official school attendance GIS public ArcGIS discovery (QA ONLY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-cfb-arcgis-attendance-sources.cjs'
      - 'tests/cfb-public-arcgis-source-census.test.cjs'
      - '.github/workflows/cfb-public-arcgis-source-census.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source-census:
    name: District identity, zone vs school point, public ArcGIS source inventory
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Offline provider and wrong-school-zone unit tests
        run: |
          node --check scripts/probe-cfb-arcgis-attendance-sources.cjs
          node --test tests/cfb-public-arcgis-source-census.test.cjs
      - name: Search live ArcGIS public item metadata and inspect known sources
        env:
          CFB_SOURCE_CENSUS_ARTIFACT: '1'
        run: node scripts/probe-cfb-arcgis-attendance-sources.cjs
      - name: Keep only public service metadata, never source polygon geometries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-public-attendance-gis-source-census-qa
          path: artifacts/cfb-public-source-census/report.json
          if-no-files-found: warn
          retention-days: 7
