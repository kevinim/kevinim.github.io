name: Denton 2026 official campus markers and 2024 point provenance QA (no deploy)
on:
  push:
    branches: [feature/denton-public-campus-points-20261109]
  pull_request:
    branches: [feature/denton-isd-2026-27-official-zone-fallback-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    name: 31-source TEA/NCES point crosschecks, 39 official campus grade IDs, privacy and no-zone regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned
        with:
          node-version: '24'
      - run: |
          node --check denton-campus-point-quality.js
          node --check dashboard-main.js
          node --test tests/denton-campus-point-quality.test.cjs tests/denton-official-zone-references.test.cjs
          node scripts/verify-main-data.mjs
  mobile-desktop-browser:
    name: Real Denton school marker click 390/1366px -> correct PDF, 31 reviewed, 8 provisional, zero false polygons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned
        with:
          node-version: '24'
      - name: Install isolated free Chromium
        run: |
          mkdir -p denton-campus-browser-qa-tmp
          cd denton-campus-browser-qa-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit --ignore-scripts playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Real campus marker click and reviewed vs unreviewed vintages
        env:
          NODE_PATH: ${{ github.workspace }}/denton-campus-browser-qa-tmp/node_modules
        run: node scripts/test-denton-real-campus-marker-browser.cjs
      - name: Attach real Leaflet campus/official PDF screenshots without home addresses
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned
        with:
          name: denton-39-campus-marker-and-pdf-ui-390-1366
          path: artifacts/denton-campuses/
          if-no-files-found: warn
          retention-days: 14
