name: P1 data integrity QA (PR only)
on:
  push:
    branches:
      - audit/p1-data-integrity-20261108
  pull_request:
    paths:
      - 'tests/p1-data-integrity.test.cjs'
      - 'data/resilience/source-status-2026.json'
      - 'data/healthcare/**'
      - 'data/dfw-crime-city-2023-2025.geojson'
      - 'data/resilience/fema-nri-dfw-winter-2025.json'
concurrency:
  group: tx-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/p1-data-integrity.test.cjs tests/p42-resilience-scope.test.cjs tests/p41-healthcare-inventory.test.cjs
