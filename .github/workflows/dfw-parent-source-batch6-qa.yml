name: DFW batch 6 parent guidance integrity (read-only)
on:
  push:
    branches: [feature/dfw-parent-guidance-batch6-20261109]
  pull_request:
    branches: [main]
    paths:
      - 'district-registry.js'
      - 'data/dfw-parent-source-evidence-batch6-2026.json'
      - 'data/dfw-school-coverage-matrix-2026.json'
      - 'scripts/audit-school-provenance.cjs'
      - 'tests/dfw-parent-guidance-batch6.test.cjs'
      - '.github/workflows/dfw-parent-source-batch6-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-provenance:
    name: DFW school source integrity and no-inferred-GIS
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned
        with:
          node-version: '24'
      - name: Syntax and deterministic coverage matrix
        run: |
          node --check district-registry.js
          node --check scripts/audit-school-provenance.cjs
          node --check tests/dfw-parent-guidance-batch6.test.cjs
          node scripts/build-dfw-school-coverage-matrix.cjs --check
      - name: Source and security tests
        run: |
          node --test tests/dfw-parent-guidance-batch6.test.cjs tests/dfw-parent-guidance-batch5.test.cjs tests/dfw-parent-guidance-batch4.test.cjs tests/dfw-parent-guidance-batch3.test.cjs tests/dfw-parent-guidance-next12.test.cjs tests/dfw-school-coverage-matrix.test.cjs tests/audit-school-provenance.test.cjs tests/audit-gis-upload-links.test.cjs tests/dfw-neighbor-finders.test.cjs tests/school-zone-ui.test.cjs
  browser:
    name: Mobile and desktop school list and official link regression
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned
        with:
          node-version: '24'
      - name: Install browser for isolated tests
        run: |
          mkdir -p dfw-coverage-browser-tmp
          cd dfw-coverage-browser-tmp
          npm init -y >/dev/null
          npm install --no-fund --no-audit --ignore-scripts playwright@1.65.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Serve branch snapshot
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dfw-batch6.log 2>&1 &
          sleep 2
      - name: Browser verification
        env:
          NODE_PATH: ${{ github.workspace }}/dfw-coverage-browser-tmp/node_modules
        run: node scripts/test-dfw-school-coverage-browser.cjs
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned
        with:
          name: dfw-parent-batch6-ui
          path: artifacts/dfw-school-coverage-ui/
          if-no-files-found: warn
