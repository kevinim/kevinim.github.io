<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>TEA 인종별 공개 인원 비율 · UAT</title>
<link rel="stylesheet" href="./peims-published-share-preview.css">
<script src="./peims-published-share-preview.js" defer></script>
</head>
<body>
<main>
  <p class="eyebrow">독립 UAT · 공식 TEA PEIMS 2025–26</p>
  <h1>공개된 학생 인원 기준 비율</h1>
  <p>이 화면은 대시보드에 병합하기 전 표시 방식을 검증하는 미리보기입니다. 집 주소·학교 배정·지도 데이터와 관계가 없습니다.</p>
  <section class="search" aria-label="학교 선택">
    <label for="campus">학교 이름 또는 9자리 Campus ID</label>
    <div class="search-row">
      <input id="campus" type="search" list="campus-options" autocomplete="off" spellcheck="false" aria-describedby="search-help">
      <datalist id="campus-options"></datalist>
      <button id="view" type="button">학교 보기</button>
    </div>
    <p class="hint" id="search-help">학교 이름을 입력하여 자동완성에서 선택하세요. 공개된 집단이 2개 이상일 때만 부분 비율 차트가 표시됩니다.</p>
  </section>
  <section class="report" id="result" aria-live="polite" aria-label="공개된 인원 기준 결과">
    <p>공개된 학교별 집계를 읽는 중입니다.</p>
  </section>
  <footer>본 자료의 비율은 비공개 및 미표시 집단을 제외한 공개된 인원 중 상대적 비중이며, 전체 학교 학생 분포로 사용하면 안 됩니다.</footer>
</main>
</body>
</html>
